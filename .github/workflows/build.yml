# PR 빌드 검사: main 으로 들어오는 PR 마다 빌드하고 결과물(exe)을 아티팩트로 남긴다.
name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: ./build.ps1

      # 단위 테스트 (tests/Lish.Tests, xUnit). 하나라도 실패하면 build 검사가 실패한다.
      - name: Test
        shell: pwsh
        run: dotnet test tests/Lish.Tests -c Release --nologo --logger "trx;LogFileName=lish-tests.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lish-${{ github.sha }}
          path: |
            dist/lish.exe
            dist/lish.exe.config
            dist/D2Coding-OFL.txt
            dist/THIRD-PARTY-NOTICES.txt
          retention-days: 14
