# OSSF Scorecard: 저장소의 공급망 보안 관행(브랜치 보호, 의존성 고정, 토큰 권한, 서명 릴리스 등)을 점검해 점수를 매긴다.
# 결과는 Security 탭(code scanning)에 SARIF 로 올라가고, publish_results 로 공개 API/배지
# (https://scorecard.dev/viewer/?uri=github.com/struggler-labs/lish) 에도 게시된다.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
